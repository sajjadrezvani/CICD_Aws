name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag srk2000/cicd_aws
    - name: Push the image to DockerHub
      run: docker login -u srk2000 -p ${{secrets.DOCKER_TOKEN}} && docker push srk2000/cicd_aws
